# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "release*" ]
  pull_request:
    branches: []
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-22.04

    # Every postgres-backed test in this repo is gated on testing.Short(), and
    # this job used to pass -short - so the whole integrationtest package, every
    # pkg/app handler test and all of pkg/storage had never once executed in CI.
    # The suite was green because it did not run. Providing the database is what
    # makes -short unnecessary; see the Test step below.
    #
    # Credentials and database name are what sdinsure's storage testutils
    # defaults to (127.0.0.1:5432, postgres/password/unittest), so tests need no
    # configuration. TZ matches run_postgres.sh.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          TZ: gmt+8
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: unittest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unittest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No -short: the postgres service above is what the skipped tests were
      # waiting for.
      #
      # -p 1 is required, not tuning. The packages share one database and
      # truncate tables in their setup, so parallel package binaries delete each
      # other's fixtures and fail in ways that look like flakes.
      #
      # integrationtest binds fixed ports 50050/50051, which is another reason
      # nothing here may run concurrently.
      - name: Test
        id: test
        run: |
          export GOPATH=/home/runner/go
          export PATH=$PATH:/home/runner/go/bin
          go test -race -v ./... -p 1 -timeout 15m -coverprofile=coverage.out
  generated:
    name: Generated code is in sync
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      # Both generators are pinned. buf resolves its plugins from the committed
      # api/buf.lock, and gen-swagger-go-client.sh refuses to run against a
      # swagger it was not pinned to, so this job is reproducible rather than
      # dependent on whatever the runner happens to have.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.38.0

      # go install, not a release asset. v0.33.0 is a valid module version but
      # has no GitHub release, so downloading swagger_linux_amd64 from it 404s -
      # and `curl -o` writes the 404 body to the file and still exits 0. The
      # result is an "executable" containing the text "Not Found", which bash
      # runs as a shell script: `Not: command not found`, exit 127, with the
      # install step reporting success. Installing from the module proxy makes
      # the version the single source of truth and fails loudly when wrong.
      - name: Install swagger
        run: go install github.com/go-swagger/go-swagger/cmd/swagger@v0.33.0

      # Regenerates api/ from api/restcol.proto and diffs against what is
      # committed. This exists because DeleteCollection's `force` field lived in
      # the proto and the swagger for eight months while the generated Go client
      # had no way to send it - the contract said one thing and the client
      # another, with nothing to notice.
      - name: Regenerate and diff
        run: |
          export PATH=$PATH:$HOME/go/bin
          make gen-check
